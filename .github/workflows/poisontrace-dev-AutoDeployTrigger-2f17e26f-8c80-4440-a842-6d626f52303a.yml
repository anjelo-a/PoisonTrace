name: Trigger auto deployment for poisontrace-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/poisontrace-dev-AutoDeployTrigger-2f17e26f-8c80-4440-a842-6d626f52303a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POISONTRACEDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POISONTRACEDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POISONTRACEDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: deploy/docker/Dockerfile
          registryUrl: poisontracedevacr.azurecr.io
          registryUsername: ${{ secrets.POISONTRACEDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.POISONTRACEDEV_REGISTRY_PASSWORD }}
          containerAppName: poisontrace-dev
          resourceGroup: rg-poisontrace-p0p1-dev-sea
          imageToBuild: poisontracedevacr.azurecr.io/poisontrace-dev:${{ github.sha }}
          imageToDeploy: poisontracedevacr.azurecr.io/poisontrace-dev:${{ github.sha }}
          targetPort: 8080
          environmentVariables: DATABASE_URL=${{ secrets.POISONTRACEDEV_DATABASE_URL }}

      - name: Verify deployment health
        shell: bash
        run: |
          set -euo pipefail
          APP_HEALTH_URL="https://poisontrace-dev.livelymeadow-b0f616bc.southeastasia.azurecontainerapps.io/healthz"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 8 "$APP_HEALTH_URL" > /dev/null; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Health check attempt $attempt failed, retrying..."
            sleep 5
          done

          echo "Health check did not pass. Dumping revision and log details."
          az containerapp revision list -n poisontrace-dev -g rg-poisontrace-p0p1-dev-sea -o table || true
          az containerapp logs show -n poisontrace-dev -g rg-poisontrace-p0p1-dev-sea --type system --tail 200 || true
          az containerapp logs show -n poisontrace-dev -g rg-poisontrace-p0p1-dev-sea --tail 200 || true
          exit 1
